name: Daily Paper Fund Office Check-In Sync

on:
  schedule:
    # Weekdays 14:38 Taiwan Time (06:38 UTC) — right after TWSE settlement
    - cron: '38 6 * * 1-5'
    # Weekdays 05:38 Taiwan Time (21:38 UTC) — right after US Market settlement
    - cron: '38 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-paper-fund-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RPG Office repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync latest NT$1M Paper Fund settlement into Office state.json
        run: python3 scripts/auto_checkin_settlement.py

      - name: Commit and push updated Office state.json
        run: |
          git config user.name "Office Steward Auto-Sync"
          git config user.email "steward-bot@project-lifeblood.local"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "🛵 Auto-checkin daily paper fund PnL $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi
