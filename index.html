<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Lifeblood — 雙事業部 24/7 LIVE RPG 集團總部</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --card2: #0f172a;
      --border: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #f43f5e;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #1e293b;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
    }
    .header {
      background: rgba(17, 24, 39, 0.96);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px);
    }
    .container { max-width: 1440px; margin: 0 auto; }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .crown-box {
      width: 38px; height: 38px; border-radius: 10px;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .title { font-size: 15px; font-weight: 700; margin: 0; }
    .subtitle { font-size: 11px; color: var(--muted); margin: 2px 0 0; }
    .badges { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .pill {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: #1e293b; color: var(--text); font-weight: 600;
    }
    .pill-live {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-family: ui-monospace, monospace;
    }
    .quota-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
    .quota-box { min-width: 210px; }
    .quota-head { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
    .bar-bg {
      height: 10px; border-radius: 999px; background: #1e293b;
      overflow: hidden; border: 1px solid #334155;
    }
    .bar-fill { height: 100%; transition: width 0.35s ease; }
    .btn {
      border: 1px solid #334155;
      background: #1e293b;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #334155; }
    .btn-primary { background: #0284c7; border-color: #0ea5e9; color: #fff; }
    .btn-primary:hover { background: #0369a1; }
    .grid {
      display: grid;
      grid-template-columns: 1.38fr 1fr;
      gap: 16px;
      padding: 16px;
    }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .card-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; font-weight: 400; color: var(--muted); font-size: 11px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .canvas-wrap { padding: 8px; background: #070c17; display: flex; justify-content: center; }
    canvas { width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); image-rendering: pixelated; cursor: pointer; }
    .inspector { padding: 12px; }
    .inspector-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    @media (max-width: 640px) { .inspector-grid { grid-template-columns: 1fr; } }
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab-btn {
      flex: 1; background: transparent; border: none; border-bottom: 2px solid transparent;
      color: var(--muted); padding: 10px 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--primary); }
    .panel-body { max-height: 680px; overflow-y: auto; padding: 12px; }
    .hidden { display: none; }
    .report-item {
      padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card2); margin-bottom: 8px;
    }
    .report-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: 11px; }
    .org-node {
      padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card2); cursor: pointer; margin-bottom: 6px;
    }
    .org-node.selected { border-color: var(--primary); }
    .org-node.boss-node { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.4); }
    .div-box {
      padding: 10px; border-radius: 8px; border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.55); margin-bottom: 10px;
    }
    .div-title { font-size: 11px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.02em; }
    .org-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @media (max-width: 520px) { .org-grid { grid-template-columns: 1fr; } }
    .arrow { text-align: center; color: var(--muted); font-size: 11px; margin: 4px 0 6px; }
    .file-row {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card2); margin-bottom: 6px; font-family: ui-monospace, monospace; font-size: 11px;
    }
    .mono { font-family: ui-monospace, monospace; }
    .muted { color: var(--muted); }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-row">
      <div class="brand">
        <div class="crown-box">👑</div>
        <div>
          <div class="badges">
            <h1 class="title">大 Boss 雙事業部集團總部 · 24/7 LIVE RPG 辦公室</h1>
            <span id="live-pill" class="pill pill-live">● LIVE 連線中</span>
            <span id="status-pill" class="pill">載入中...</span>
          </div>
          <p class="subtitle">
            第一事業部（生存金流點子戰隊）＋ 第二事業部（Alpha 股市投資戰情部）· GitHub API 秒級同步 · <a href="https://drive.google.com/drive/folders/1nt2wn1MXwd_ThRvHjOmi9lS9mOKfT844" target="_blank">Google Drive 總檔案庫 ↗</a>
          </p>
        </div>
      </div>

      <div class="quota-wrap">
        <div class="quota-box">
          <div class="quota-head">
            <span class="muted">集團算力額度（歸零自動下班）</span>
            <span id="quota-text" class="mono" style="font-weight:700">-- / --</span>
          </div>
          <div class="bar-bg"><div id="quota-bar" class="bar-fill" style="width:0%; background:var(--success)"></div></div>
        </div>
        <button class="btn btn-primary" onclick="fetchState(true)">🔄 立即更新</button>
      </div>
    </div>
  </header>

  <main class="container grid">
    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="card">
        <div class="card-head">
          <span>🏢 雙事業部 2D RPG 總部（10 人編制 · 點擊角色查看任務與部門）</span>
          <div class="legend">
            <span><i class="dot" style="background:var(--success)"></i>上工</span>
            <span><i class="dot" style="background:var(--primary)"></i>開會</span>
            <span><i class="dot" style="background:var(--warning)"></i>閒置</span>
            <span><i class="dot" style="background:var(--error)"></i>額度耗盡下班</span>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="office-canvas" width="780" height="580"></canvas>
        </div>
      </div>

      <div class="card inspector" id="inspector">載入角色資料中...</div>
    </div>

    <div class="card" style="display:flex; flex-direction:column;">
      <div class="tabs">
        <button class="tab-btn active" data-tab="org">🏛️ 集團組織架構</button>
        <button class="tab-btn" data-tab="reports">📋 真實工作回報</button>
        <button class="tab-btn" data-tab="files">☁️ 檔案與 Drive</button>
      </div>

      <div id="tab-org" class="panel-body"></div>
      <div id="tab-reports" class="panel-body hidden"></div>
      <div id="tab-files" class="panel-body hidden"></div>
    </div>
  </main>

  <script>
    const STATUS_META = {
      boss:     { label: "視察中",       icon: "👑", color: "#f59e0b" },
      working:  { label: "上工中",       icon: "💻", color: "#10b981" },
      meeting:  { label: "開會中",       icon: "🗣️", color: "#38bdf8" },
      idle:     { label: "閒置待命",     icon: "☕", color: "#f59e0b" },
      depleted: { label: "額度耗盡下班", icon: "💤", color: "#f43f5e" }
    };

    const ROOMS = [
      { name: "👑 大 Boss 總裁室",                   x: 14,  y: 14,  w: 220, h: 138, fill: "#231d12" },
      { name: "🎯 集團總管中樞 (Antigravity)",       x: 246, y: 14,  w: 210, h: 138, fill: "#162032" },
      { name: "🗣️ 跨部門戰略會議室",                 x: 468, y: 14,  w: 298, h: 190, fill: "#132238" },
      { name: "💰 第一事業部：生存金流點子戰隊",     x: 14,  y: 164, w: 442, h: 196, fill: "#161f30" },
      { name: "📈 第二事業部：Alpha 股市投資戰情室", x: 14,  y: 372, w: 442, h: 194, fill: "#132620" },
      { name: "☕ 集團茶水間 / 待命休息區",          x: 468, y: 216, w: 298, h: 350, fill: "#18202c" }
    ];

    const POS = {
      boss:                   { desk: { x: 124, y: 92 },  meet: { x: 617, y: 68 },  lounge: { x: 124, y: 92 } },
      commander:              { desk: { x: 351, y: 92 },  meet: { x: 520, y: 112 }, lounge: { x: 525, y: 278 } },
      // Division 1: Cash-Flow Squad
      pain_hunter:            { desk: { x: 115, y: 230 }, meet: { x: 555, y: 162 }, lounge: { x: 615, y: 278 } },
      indie_hacker_builder:   { desk: { x: 340, y: 230 }, meet: { x: 617, y: 168 }, lounge: { x: 705, y: 278 } },
      monetization_architect: { desk: { x: 115, y: 312 }, meet: { x: 680, y: 162 }, lounge: { x: 525, y: 360 } },
      ruthless_critic:        { desk: { x: 340, y: 312 }, meet: { x: 715, y: 112 }, lounge: { x: 615, y: 360 } },
      // Division 2: Alpha Stock Division
      supply_chain_scout:     { desk: { x: 115, y: 438 }, meet: { x: 540, y: 80 },  lounge: { x: 705, y: 360 } },
      chip_momentum_tracker:  { desk: { x: 340, y: 438 }, meet: { x: 695, y: 80 },  lounge: { x: 525, y: 448 } },
      macro_etf_strategist:   { desk: { x: 115, y: 520 }, meet: { x: 585, y: 165 }, lounge: { x: 615, y: 448 } },
      chief_risk_officer:     { desk: { x: 340, y: 520 }, meet: { x: 650, y: 165 }, lounge: { x: 705, y: 448 } }
    };

    let STATE = null;
    let selectedId = "supply_chain_scout";
    const sprites = {};
    let frame = 0;

    function targetFor(a) {
      const p = POS[a.id] || { desk: { x: 200, y: 300 }, meet: { x: 600, y: 130 }, lounge: { x: 600, y: 500 } };
      if (a.isBoss || a.status === "working") return p.desk;
      if (a.status === "meeting") return p.meet;
      return p.lounge;
    }

    async function fetchState(manual = false) {
      const pill = document.getElementById("live-pill");
      if (manual) pill.textContent = "● 同步中...";
      try {
        let res = await fetch(
          `https://api.github.com/repos/howardKung/project-lifeblood-rpg-office/contents/state.json?ref=main`,
          { headers: { "Accept": "application/vnd.github.raw+json" }, cache: "no-store" }
        );
        if (!res.ok) {
          res = await fetch(`./state.json?t=${Date.now()}`, { cache: "no-store" });
        }
        if (!res.ok) throw new Error("HTTP " + res.status);
        STATE = await res.json();
        STATE.agents.forEach(a => {
          const t = targetFor(a);
          if (!sprites[a.id]) sprites[a.id] = { x: t.x, y: t.y };
        });
        pill.textContent = `● LIVE · ${new Date().toTimeString().slice(0, 8)}`;
        renderUI();
      } catch (e) {
        pill.textContent = "● 讀取失敗: " + e.message;
      }
    }

    function renderUI() {
      if (!STATE) return;
      const q = STATE.quota;
      const pct = Math.max(0, Math.min(100, (q.remaining / q.max) * 100));
      document.getElementById("quota-text").textContent = `${q.remaining} / ${q.max} 點`;
      const bar = document.getElementById("quota-bar");
      bar.style.width = pct + "%";
      bar.style.background = pct > 35 ? "var(--success)" : (pct > 0 ? "var(--warning)" : "var(--error)");

      const workers = STATE.agents.filter(a => !a.isBoss);
      const w = workers.filter(a => a.status === "working").length;
      const m = workers.filter(a => a.status === "meeting").length;
      const i = workers.filter(a => a.status === "idle").length;
      document.getElementById("status-pill").textContent = q.remaining <= 0
        ? "💤 額度耗盡・全員下班"
        : `編制 10 人｜上工 ${w} · 開會 ${m} · 待命 ${i}`;

      renderInspector();
      renderOrg();
      renderReports();
      renderFiles();
    }

    function divBadge(div) {
      if (div === "stock") return `<span class="pill" style="background:rgba(234,179,8,0.16); color:#facc15;">📈 股市二部</span>`;
      if (div === "cashflow") return `<span class="pill" style="background:rgba(56,189,248,0.15); color:#38bdf8;">💰 金流一部</span>`;
      return `<span class="pill" style="background:rgba(168,85,247,0.18); color:#c084fc;">🏛️ 集團總部</span>`;
    }

    function renderInspector() {
      const a = STATE.agents.find(x => x.id === selectedId) || STATE.agents[0];
      const meta = STATUS_META[a.status] || STATUS_META.idle;
      document.getElementById("inspector").innerHTML = `
        <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--border);">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span class="dot" style="background:${a.color}; width:10px; height:10px; margin:0;"></span>
            <strong style="font-size:14px;">${a.name}</strong>
            ${divBadge(a.division)}
            <span class="muted">${a.role}</span>
            <span class="pill" style="color:${meta.color}">${meta.icon} ${meta.label}</span>
          </div>
          <span class="mono muted" style="font-size:11px;">最後打卡：${a.lastUpdate}</span>
        </div>
        <div class="inspector-grid">
          <div><div class="muted" style="font-size:11px;">當前真實任務</div><div style="margin-top:3px;">${a.currentTask}</div></div>
          <div><div class="muted" style="font-size:11px;">個人額度 / 完工數</div><div class="mono" style="margin-top:3px;">${a.isBoss ? "∞ 無限" : `${a.quota} / ${a.maxQuota} 點`} · ${a.tasksCompleted} 筆</div></div>
          <div><div class="muted" style="font-size:11px;">代理識別碼</div><div class="mono muted" style="margin-top:3px; word-break:break-all;">${a.conversationId}</div></div>
        </div>
      `;
    }

    function renderOrg() {
      const boss = STATE.agents.find(a => a.tier === 0);
      const cmd = STATE.agents.find(a => a.tier === 1);
      const div1 = STATE.agents.filter(a => a.division === "cashflow");
      const div2 = STATE.agents.filter(a => a.division === "stock");

      const card = (a, isBoss = false) => {
        const meta = STATUS_META[a.status] || STATUS_META.idle;
        return `
          <div class="org-node ${isBoss ? 'boss-node' : ''} ${a.id === selectedId ? 'selected' : ''}" onclick="selectedId='${a.id}'; renderInspector(); renderOrg();">
            <div style="display:flex; justify-content:space-between; gap:6px; align-items:center;">
              <div><i class="dot" style="background:${a.color}"></i><strong>${a.name}</strong></div>
              <span style="color:${meta.color}; font-size:11px; font-weight:600;">${meta.icon} ${meta.label}</span>
            </div>
            <div class="muted" style="font-size:11px; margin-top:2px;">${a.role}</div>
            ${!a.isBoss ? `
              <div style="display:flex; align-items:center; gap:8px; margin-top:5px;">
                <div class="bar-bg" style="flex:1; height:5px;"><div class="bar-fill" style="width:${(a.quota/a.maxQuota)*100}%; background:${a.quota>30?'var(--success)':(a.quota>0?'var(--warning)':'var(--error)')}"></div></div>
                <span class="mono muted" style="font-size:11px;">${a.quota}點</span>
              </div>
            ` : `<div style="color:var(--warning); font-size:11px; margin-top:4px;">★ 集團最高決策、財務零付費紅線與額度總控</div>`}
          </div>
        `;
      };

      document.getElementById("tab-org").innerHTML = `
        <div class="muted" style="font-size:11px; margin-bottom:4px;">LEVEL 0 · 集團最高決策層</div>
        ${card(boss, true)}
        <div class="arrow">↓ 全權授權調度（嚴守付費前必先請示紅線）</div>
        <div class="muted" style="font-size:11px; margin-bottom:4px;">LEVEL 1 · 集團 AI 總管</div>
        ${card(cmd)}
        <div class="arrow">↙ 雙事業部平行運作 ↘</div>
        <div class="div-box">
          <div class="div-title" style="color:#38bdf8;">💰 第一事業部：生存金流點子戰隊（3 支 Apify Actor + AgentGuard）</div>
          <div class="org-grid">${div1.map(a => card(a)).join("")}</div>
        </div>
        <div class="div-box" style="border-color:rgba(234,179,8,0.4);">
          <div class="div-title" style="color:#facc15;">📈 第二事業部：Alpha 股市投資戰情部（台股 · 美股 · ETF 波段共振）</div>
          <div class="org-grid">${div2.map(a => card(a)).join("")}</div>
        </div>
      `;
    }

    function renderReports() {
      const el = document.getElementById("tab-reports");
      el.innerHTML = STATE.reports.map(r => {
        const meta = STATUS_META[r.status] || STATUS_META.working;
        return `
          <div class="report-item">
            <div class="report-top">
              <div><strong>${r.agentName}</strong> <span class="pill" style="color:${meta.color}; margin-left:4px;">${meta.icon} ${meta.label}</span></div>
              <span class="mono muted">${r.time.slice(5)} ${r.cost > 0 ? `· -${r.cost}點` : ""}</span>
            </div>
            <div style="color:#cbd5e1;">${r.summary}</div>
          </div>
        `;
      }).join("");
    }

    function renderFiles() {
      const t = STATE.telemetry || { totalLocalFiles: 0, driveSyncedFiles: 0, recentFiles: [], snapshotTime: "--" };
      document.getElementById("tab-files").innerHTML = `
        <div class="report-item" style="margin-bottom:12px;">
          <strong>☁️ Google Drive 集團永久歸檔庫</strong>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
            <div class="org-node" style="margin:0;"><div class="muted" style="font-size:11px;">工作區實檔數</div><div class="mono" style="font-size:15px; font-weight:700;">${t.totalLocalFiles} 檔</div></div>
            <div class="org-node" style="margin:0;"><div class="muted" style="font-size:11px;">已同步 Drive</div><div class="mono" style="font-size:15px; font-weight:700; color:var(--success);">${t.driveSyncedFiles} 檔</div></div>
          </div>
          <div class="muted" style="font-size:11px; margin-top:8px;">
            最後推送時間：<code>${t.snapshotTime}</code><br/>
            Drive 資料夾：<a href="https://drive.google.com/drive/folders/${STATE.driveFolderId}" target="_blank">開啟 Antigravity_生存金流點子戰隊 ↗</a>
          </div>
        </div>
        <div style="font-weight:600; margin-bottom:6px;">📂 最近異動檔案（真實磁碟掃描）</div>
        ${(t.recentFiles || []).map(f => `<div class="file-row"><span style="color:var(--primary); overflow:hidden; text-overflow:ellipsis;">${f.path}</span><span class="muted">${f.mtime.slice(5)}</span></div>`).join("")}
      `;
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const target = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === target));
        ["org", "reports", "files"].forEach(t => document.getElementById("tab-" + t).classList.toggle("hidden", t !== target));
      });
    });

    const canvas = document.getElementById("office-canvas");
    const ctx = canvas.getContext("2d");

    canvas.addEventListener("click", e => {
      if (!STATE) return;
      const r = canvas.getBoundingClientRect();
      const cx = (e.clientX - r.left) * (canvas.width / r.width);
      const cy = (e.clientY - r.top) * (canvas.height / r.height);
      let hit = null, minD = 34;
      STATE.agents.forEach(a => {
        const p = sprites[a.id];
        if (!p) return;
        const d = Math.hypot(p.x - cx, p.y - cy);
        if (d < minD) { minD = d; hit = a; }
      });
      if (hit) { selectedId = hit.id; renderInspector(); renderOrg(); }
    });

    function drawDesk(x, y, w, h, active, mode = "dev") {
      ctx.fillStyle = mode === "boss" ? "#7c2d12" : (mode === "stock" ? "#1e293b" : "#92400e");
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = mode === "boss" ? "#431407" : (mode === "stock" ? "#0f172a" : "#78350f");
      ctx.fillRect(x, y + h, w, 5);

      if (mode === "stock") {
        // Dual Bloomberg-style candlestick monitors!
        [-16, 4].forEach((ox, idx) => {
          const mx = x + w / 2 + ox, my = y - 5;
          ctx.fillStyle = "#090d16"; ctx.fillRect(mx, my, 18, 13);
          ctx.fillStyle = active ? (idx === 0 ? "#064e3b" : "#1e1b4b") : "#1e293b";
          ctx.fillRect(mx + 1, my + 1, 16, 10);
          // Mini green/red candles
          ctx.fillStyle = "#10b981"; ctx.fillRect(mx + 3, my + 5, 3, 5);
          ctx.fillStyle = "#f43f5e"; ctx.fillRect(mx + 8, my + 3, 3, 6);
          ctx.fillStyle = "#10b981"; ctx.fillRect(mx + 13, my + 2, 3, 7);
        });
      } else {
        const mx = x + w / 2 - 14, my = y - 4;
        ctx.fillStyle = "#0f172a"; ctx.fillRect(mx, my, 28, 15);
        ctx.fillStyle = active ? (frame % 40 < 20 ? "#38bdf8" : "#22d3ee") : "#334155";
        ctx.fillRect(mx + 2, my + 2, 24, 10);
      }
    }

    function draw() {
      frame++;
      ctx.fillStyle = "#0b1120"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(255,255,255,0.03)";
      for (let x = 0; x < canvas.width; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

      ROOMS.forEach(r => {
        ctx.fillStyle = r.fill; ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = "#334155"; ctx.lineWidth = 2; ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.fillRect(r.x + 1, r.y + 1, r.w - 2, 21);
        ctx.fillStyle = "#e2e8f0"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "left";
        ctx.fillText(r.name, r.x + 8, r.y + 15);
      });

      // Boss carpet & desk
      ctx.fillStyle = "rgba(220,38,38,0.18)"; ctx.fillRect(54, 48, 140, 82);
      drawDesk(84, 98, 80, 22, true, "boss");

      const st = id => STATE?.agents.find(a => a.id === id)?.status;
      drawDesk(311, 98, 80, 22, st("commander") === "working", "dev");

      // Division 1 Desks
      drawDesk(75,  238, 80, 20, st("pain_hunter") === "working", "dev");
      drawDesk(300, 238, 80, 20, st("indie_hacker_builder") === "working", "dev");
      drawDesk(75,  320, 80, 20, st("monetization_architect") === "working", "dev");
      drawDesk(300, 320, 80, 20, st("ruthless_critic") === "working", "dev");

      // Division 2 Stock Trading Terminals + Live Wall Ticker
      ctx.fillStyle = "#090d16"; ctx.fillRect(210, 376, 238, 15);
      ctx.fillStyle = "#10b981"; ctx.font = "bold 9px monospace"; ctx.textAlign = "left";
      ctx.fillText("TWSE ▲ | NVDA ▲ | QQQ ▲ | SMH ▲ | 0050 ▲", 216, 387);

      drawDesk(75,  446, 82, 20, st("supply_chain_scout") === "working", "stock");
      drawDesk(300, 446, 82, 20, st("chip_momentum_tracker") === "working", "stock");
      drawDesk(75,  528, 82, 20, st("macro_etf_strategist") === "working", "stock");
      drawDesk(300, 528, 82, 20, st("chief_risk_officer") === "working", "stock");

      // Meeting table & Lounge
      ctx.fillStyle = "#1e293b"; ctx.beginPath(); ctx.roundRect(550, 88, 135, 62, 16); ctx.fill();
      ctx.strokeStyle = "#475569"; ctx.stroke();
      ctx.fillStyle = "#78350f"; ctx.fillRect(486, 244, 88, 16);
      ctx.fillStyle = "#166534"; ctx.beginPath(); ctx.roundRect(630, 242, 110, 22, 6); ctx.fill();
      ctx.fillStyle = "#1e3a8a"; ctx.beginPath(); ctx.roundRect(555, 515, 130, 24, 6); ctx.fill();

      if (STATE?.agents) {
        [...STATE.agents].sort((a, b) => (sprites[a.id]?.y || 0) - (sprites[b.id]?.y || 0)).forEach(a => {
          const p = sprites[a.id]; if (!p) return;
          const t = targetFor(a);
          const dx = t.x - p.x, dy = t.y - p.y, dist = Math.hypot(dx, dy);
          if (dist > 1.5) { p.x += (dx / dist) * 2.6; p.y += (dy / dist) * 2.6; } else { p.x = t.x; p.y = t.y; }
          const bob = dist > 1.5 ? Math.sin(frame * 0.35) * 2.5 : (a.status === "working" ? Math.sin(frame * 0.25) * 1 : 0);
          const x = Math.round(p.x), y = Math.round(p.y + bob);
          const meta = STATUS_META[a.status] || STATUS_META.idle;

          if (a.id === selectedId) {
            ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(x, y + 9, 17, 8, 0, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(x, y + 9, 11, 4.5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = a.status === "depleted" ? "#64748b" : a.shirt; ctx.fillRect(x - 8, y - 6, 16, 14);
          ctx.fillStyle = "#fde68a"; ctx.fillRect(x - 7, y - 19, 14, 13);
          ctx.fillStyle = a.hair; ctx.fillRect(x - 8, y - 22, 16, 5);
          ctx.fillStyle = "#0f172a"; ctx.fillRect(x - 4, y - 13, 2, 3); ctx.fillRect(x + 2, y - 13, 2, 3);

          if (a.isBoss) {
            ctx.fillStyle = "#facc15";
            ctx.fillRect(x - 7, y - 27, 14, 5);
            ctx.fillRect(x - 7, y - 30, 3, 3);
            ctx.fillRect(x - 1, y - 31, 3, 4);
            ctx.fillRect(x + 4, y - 30, 3, 3);
          }

          ctx.font = "bold 9.5px sans-serif"; ctx.textAlign = "center";
          const lw = ctx.measureText(a.name).width + 14;
          ctx.fillStyle = "rgba(15,23,42,0.92)";
          ctx.beginPath(); ctx.roundRect(x - lw / 2, y + 12, lw, 14, 4); ctx.fill();
          ctx.strokeStyle = meta.color; ctx.lineWidth = 1; ctx.stroke();
          ctx.fillStyle = meta.color; ctx.beginPath(); ctx.arc(x - lw / 2 + 5, y + 19, 2.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#f8fafc"; ctx.fillText(a.name, x + 3, y + 22);
        });
      }
      requestAnimationFrame(draw);
    }

    fetchState();
    setInterval(() => fetchState(false), 20000);
    draw();
  </script>
</body>
</html>
